schema_version: 1
profile: library
name: repo-contract
description: Machine-validated repository documentation contract for agent-driven projects.

documents:
  spec:
    path: docs/SPEC.md
    authority: normative
  requirements:
    path: docs/REQUIREMENTS.md
    authority: normative
    id_prefix: REQ
  boundaries:
    path: docs/BOUNDARIES.md
    authority: normative
    id_prefix: BOUNDARY
  architecture:
    path: docs/ARCHITECTURE.md
    authority: descriptive
  design:
    path: docs/DESIGN.md
    authority: normative

commands:
  bootstrap: python3 -m pytest -q
  check: python3 scripts/validate.py . --profile library
  test: python3 -m pytest -q
  validate: python3 -m pytest -q && python3 scripts/validate.py . --profile library

plan_required:
  paths:
    - scripts/**
    - templates/**
  change_types:
    - public-api-change
    - spec-change
    - cross-cutting-refactor

protected_control_plane:
  - AGENTS.md
  - project.yaml
  - docs/BOUNDARIES.md
  - docs/SPEC.md
  - templates/**