name: contract-check

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run validator tests
        run: python3 -m pytest -q
      - name: Validate this repo against its own contract
        run: python3 scripts/validate.py . --profile library
      - name: Validate templates as a scaffold
        run: |
          python3 .github/workflows/scaffold-check.py